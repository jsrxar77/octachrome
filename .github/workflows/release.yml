name: Release

# Pushing a tag v<major>.<minor>.<patch> builds two packages for each platform and publishes them:
#   * the demo (`--features demo`: it plays the songs and nothing can be saved) goes to the PUBLIC repository jsrxar77/octachrome-releases;
#   * the full version stays in this private repository, as a release of its own, to be uploaded where it is sold.
# The notes are the matching section of CHANGELOG.md. Run by hand (Actions > Release > Run workflow) it only builds the packages, as artifacts.
# The Linux binary is built with `cross` and, as .cargo/config.toml says, for the Raspberry Pi 5 (Cortex-A76); a Pi 4 needs a build of its own.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: octachrome-macos-arm64, target: aarch64-apple-darwin, tool: cargo, features: "", eula: EULA-full.txt }
          - { os: macos-latest, name: octachrome-demo-macos-arm64, target: aarch64-apple-darwin, tool: cargo, features: "--features demo", eula: EULA-demo.txt }
          - { os: ubuntu-latest, name: octachrome-linux-aarch64-pi5, target: aarch64-unknown-linux-gnu, tool: cross, features: "", eula: EULA-full.txt }
          - { os: ubuntu-latest, name: octachrome-demo-linux-aarch64-pi5, target: aarch64-unknown-linux-gnu, tool: cross, features: "--features demo", eula: EULA-demo.txt }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.tool == 'cross'
        run: cargo install cross --locked
      - run: ${{ matrix.tool }} build --release --target ${{ matrix.target }} -p octachrome ${{ matrix.features }}
      - name: Pack
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/octachrome dist/
          cp licenses/${{ matrix.eula }} dist/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md dist/
          if [ "${{ matrix.tool }}" = cross ]; then cp deploy/* dist/; fi
          tar -C dist -czf ${{ matrix.name }}.tar.gz .
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: The full version, in this private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir full && cp dist/octachrome-macos-* dist/octachrome-linux-* full/
          gh release create "$GITHUB_REF_NAME" full/* --title "Octachrome $GITHUB_REF_NAME (full)" --notes-file notes.md
      # The demo goes to the public repository, with a token that can write there
      # (Settings > Secrets and variables > Actions > RELEASES_TOKEN: a fine-grained token with "Contents: read and write" on octachrome-releases only).
      - name: The demo, in the public repository
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          mkdir demo && cp dist/octachrome-demo-* demo/
          gh release create "$GITHUB_REF_NAME" demo/* --repo jsrxar77/octachrome-releases --title "Octachrome $GITHUB_REF_NAME (demo)" --notes-file notes.md
      - name: No token for the public repository
        if: env.HAS_RELEASES_TOKEN != 'true'
        run: |
          echo "::warning::The secret RELEASES_TOKEN is not set, so the demo was not published in octachrome-releases"
