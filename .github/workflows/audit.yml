name: Audit

# Known vulnerabilities in the dependencies (RustSec), when Cargo.lock changes and every Monday.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, "**/Cargo.toml"]
  pull_request:
    paths: [Cargo.lock, "**/Cargo.toml"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
