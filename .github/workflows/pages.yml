name: Guide

# Publishes the site (built by scripts/build-site.py from guide/, twin/ and docs/buttons.md) as a GitHub Pages site.
# Needs Settings > Pages > Source: GitHub Actions (and a public repository, or a plan that includes Pages for private ones).
# The address of the repository for the "Source" and docs links is the one this workflow runs in; the repository variable
# OCTACHROME_REPO_URL (Settings > Secrets and variables > Actions > Variables) overrides it (a custom address, say).
on:
  push:
    branches: [main]
    paths: [guide/**, twin/**, docs/buttons.md, scripts/build-site.py, scripts/check-site.py]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build and check the site
        env:
          OCTACHROME_SITE_URL: ${{ steps.pages.outputs.base_url }}
          OCTACHROME_REPO_URL: ${{ vars.OCTACHROME_REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          python3 scripts/build-site.py
          python3 scripts/check-site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
