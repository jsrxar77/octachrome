name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev g++-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - name: Simulator smoke run
        run: cargo run --release -p octachrome -- sim -s 6 -o sim-out
      - uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: sim-out
      - name: Pi target check (no ALSA sysroot needed)
        env:
          # octachrome-plaits compiles C++ in build.rs, so the check needs a cross compiler.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo check --target aarch64-unknown-linux-gnu -p octachrome --no-default-features --features mk3

  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p octachrome
      - run: cargo test --workspace
