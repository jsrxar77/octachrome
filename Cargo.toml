[workspace]
resolver = "2"
members = [
    "crates/octachrome-plaits",
    "crates/octachrome-gfx",
    "crates/octachrome-cartridge",
    "crates/octachrome-seq",
    "crates/octachrome-engine",
    "crates/octachrome-cartridges",
    "crates/octachrome-hw",
    "crates/octachrome-ui",
    "crates/octachrome",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[workspace.lints.clippy]
# Deliberate style choices, not slips: index loops that read several arrays at once, the many parameters of a drawing
# or a voice, `next` on an envelope that is not an Iterator, and tests that start from a Default and set the fields they care about.
needless_range_loop = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"
field_reassign_with_default = "allow"
chunks_exact_to_as_chunks = "allow" # `as_chunks` needs a newer Rust than the Pi's OS packages

[workspace.dependencies]
octachrome-gfx = { path = "crates/octachrome-gfx" }
octachrome-cartridge = { path = "crates/octachrome-cartridge" }
octachrome-seq = { path = "crates/octachrome-seq" }
octachrome-engine = { path = "crates/octachrome-engine" }
octachrome-cartridges = { path = "crates/octachrome-cartridges" }
octachrome-hw = { path = "crates/octachrome-hw" }
octachrome-ui = { path = "crates/octachrome-ui" }
octachrome-plaits = { path = "crates/octachrome-plaits" }
embedded-graphics = "0.8"
rtrb = "0.3"
fontdue = "0.9"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Audio code is unusable in debug at 64-frame buffers; keep deps optimised.
[profile.dev.package."*"]
opt-level = 2
