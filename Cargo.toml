[workspace]
resolver = "2"
members = [
    "crates/op8-plaits",
    "crates/op8-gfx",
    "crates/op8-cartridge",
    "crates/op8-seq",
    "crates/op8-engine",
    "crates/op8-cartridges",
    "crates/op8-hw",
    "crates/op8-ui",
    "crates/op8",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
op8-gfx = { path = "crates/op8-gfx" }
op8-cartridge = { path = "crates/op8-cartridge" }
op8-seq = { path = "crates/op8-seq" }
op8-engine = { path = "crates/op8-engine" }
op8-cartridges = { path = "crates/op8-cartridges" }
op8-hw = { path = "crates/op8-hw" }
op8-ui = { path = "crates/op8-ui" }
op8-plaits = { path = "crates/op8-plaits" }
embedded-graphics = "0.8"
rtrb = "0.3"
fontdue = "0.9"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Audio code is unusable in debug at 64-frame buffers; keep deps optimised.
[profile.dev.package."*"]
opt-level = 2
