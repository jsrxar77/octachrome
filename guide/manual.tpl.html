<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP-8 · Manual</title>
<style>
@font-face{font-family:Jost;font-weight:300;src:url(fonts/Jost-Light.ttf)}
@font-face{font-family:Jost;font-weight:400;src:url(fonts/Jost-Regular.ttf)}
:root{color-scheme:dark;--bg:#000;--fg:#F2F4F8;--dim:#7E8794;--faint:#232831;--panel:#0D1118;--g:#00E56A;--y:#FFD21F;--acc:#0099FF}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:300 17px/1.45 Jost,system-ui,sans-serif;padding:40px 20px 80px;max-width:1000px;margin:auto;-webkit-font-smoothing:antialiased}
h1{font-weight:300;font-size:clamp(48px,10vw,96px);letter-spacing:.03em;line-height:1}
h2{font-weight:400;font-size:22px;margin:38px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:14px;color:var(--dim)}
a{color:var(--dim)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--faint);margin:22px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:15px}
.legend b{font-weight:400;color:var(--fg)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
button,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--faint);border-radius:999px;padding:7px 16px}
button{cursor:pointer}button.on{border-color:var(--acc);color:var(--acc)}
input{flex:1;min-width:180px}
.r{display:grid;grid-template-columns:130px 14px 1fr;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--faint)}
.r b{font-weight:400}.d{width:10px;height:10px;border-radius:50%;display:inline-block}
.y .d{background:var(--g)}.p .d{background:var(--y)}.n .d{background:var(--faint);border:1px solid var(--dim)}
.r small{display:block;color:var(--dim);font-size:14px}
@media(max-width:600px){.r{grid-template-columns:100px 14px 1fr}}
</style></head><body>
<p><a href="index.html">Guide</a> · <a href="brand.html">Brand</a> · Manual</p>
<h1>Manual</h1>
<p style="color:var(--dim)">Every button, what it does in OP-8, and what is still missing.</p>
<div class="bar" id="bar"></div><div class="legend" id="leg"></div>
<div class="f" id="tabs"></div><div class="f"><input id="q" placeholder="Search a button or a word"></div>
<div id="list"></div>
<p style="margin-top:40px;color:var(--dim);font-size:14px">Generated from <a href="../docs/buttons.md">docs/buttons.md</a> by <code>scripts/build-manual.py</code>. The order of work is in <a href="../docs/roadmap.md">roadmap.md</a>.</p>
<script>
const D=__DATA__;
const NAME={y:"works today",p:"partly",n:"planned"},COL={y:"var(--g)",p:"var(--y)",n:"var(--faint)"};
const cnt=t=>D.filter(r=>r.t===t).length;
document.getElementById("bar").innerHTML=["y","p","n"].map(t=>`<i style="width:${cnt(t)/D.length*100}%;background:${COL[t]}"></i>`).join("");
document.getElementById("leg").innerHTML=`<span><b>${cnt("y")}</b> work today</span><span><b>${cnt("p")}</b> partly</span><span><b>${cnt("n")}</b> planned</span><span>of ${D.length}</span>`;
const secs=["All",...new Set(D.map(r=>r.s))];let sec="All",q="";
const tabs=document.getElementById("tabs");
secs.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{sec=s;draw()};tabs.append(b)});
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function draw(){
  [...tabs.children].forEach(b=>b.classList.toggle("on",b.textContent===sec));
  let h="",last="";
  D.filter(r=>(sec==="All"||r.s===sec)&&(!q||(r.n+" "+r.w+" "+r.m+" "+r.x).toLowerCase().includes(q))).forEach(r=>{
    if(r.s!==last){last=r.s;const g=D.filter(x=>x.s===r.s);h+=`<h2>${esc(r.s)}<small>${g.filter(x=>x.t==="y").length}/${g.length}</small></h2>`}
    h+=`<div class="r ${r.t}"><b>${esc(r.n)}</b><span class="d" title="${NAME[r.t]}"></span><div>${esc(r.w)}${r.note?`<small>${esc(r.note)}</small>`:""}${r.m?`<small>Maschine: ${esc(r.m)} · OP-XY: ${esc(r.x)}</small>`:""}</div></div>`});
  document.getElementById("list").innerHTML=h||"<p style='color:var(--dim)'>Nothing found.</p>";
}
draw();
</script></body></html>
