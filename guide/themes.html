<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP-8 · Themes</title>
<link rel="icon" href="brand/op8-mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:Jost;font-weight:300;src:url(fonts/Jost-Light.ttf)}
@font-face{font-family:Jost;font-weight:400;src:url(fonts/Jost-Regular.ttf)}
:root{color-scheme:dark}*{box-sizing:border-box;margin:0}
body{background:#000;color:#F2F4F8;font:300 18px/1.45 Jost,system-ui,sans-serif;padding:28px 16px 70px;text-align:center;-webkit-font-smoothing:antialiased}
a{color:#7E8794}h1{font-weight:300;font-size:clamp(40px,8vw,72px);letter-spacing:.03em;margin:8px 0 4px}
.sub{color:#7E8794;max-width:46ch;margin:0 auto 22px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
button{font:inherit;color:inherit;background:#0D1118;border:1px solid #232831;border-radius:999px;padding:8px 22px;cursor:pointer}
button.on{border-color:#F2F4F8}
svg{width:min(980px,96vw);height:auto;display:block;margin:auto}
.cap{max-width:52ch;margin:10px auto 0;font-size:20px}.cap small{display:block;color:#7E8794;font-size:15px;margin-top:6px}
.facts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px;color:#7E8794;font-size:15px}
.facts div{background:#0D1118;border:1px solid #232831;border-radius:14px;padding:10px 16px}.facts b{color:#F2F4F8;font-weight:400;display:block;font-size:20px}
</style></head><body>
<p><a href="index.html">← Guide</a> · <a href="brand.html">Brand</a></p>
<h1>Three themes</h1>
<p class="sub">The whole machine in each one: colours, screen backlight and LED levels. Never more than the supply allows.</p>
<div class="tabs" id="tabs"></div>
<svg id="mk" role="img" aria-label="MK3 in the chosen theme"></svg>
<div class="cap" id="cap"></div>
<div class="facts">
  <div><b>16 hues × 3 levels</b>colour LEDs: pads and group keys</div>
  <div><b>1 colour</b>every other button: brightness only</div>
  <div><b>65 536</b>colours on each screen</div>
</div>
<script src="mk3.js"></script>
<script>
const RB=["#FF2D2D","#FF8A1F","#FFD21F","#00E56A","#0099FF","#4B4BFF","#B15CFF","#F2F4F8"];
const TH={
 glossy:{panel:"#0D1118",key:"#232831",off:"#1A1D23",knob:["#0099FF","#00E56A","#F2F4F8","#FF4F00","#8B6CFF","#FFD21F","#2ED3E6","#FF4FA0"],brand:RB,
  bl:1,level:3,mono:1,cap:"Glossy · as bright as the supply allows",
  note:"Strong colours. Screens at the full backlight the supply allows, pad and group LEDs at level 3, the other buttons at full."},
 matte:{panel:"#12161D",key:"#262A30",off:"#1E2127",knob:["#3B8EBA","#D9822B","#A9AFB8","#F2652A","#7FB58A","#E3C77A","#A88BC7","#D9677A"],brand:["#D9534F","#D9822B","#E3C77A","#7FB58A","#3B8EBA","#5F6BB5","#A88BC7","#F4EFE6"],
  bl:.6,level:2,mono:.7,cap:"Matte · soft",
  note:"Chalky colours. Screens at 60 % of the backlight, pad and group LEDs at level 2, the other buttons at 70 %. Easy on the eyes and on the current."},
 chrome:{panel:"#0F1014",key:"#24262C",off:"#1A1B20",knob:["#D633FF","#A442FF","#8652FF","#7361FF","#707AFF","#809DFF","#8FBCFF","#EEF0F5"],brand:["#D633FF","#A442FF","#8652FF","#7361FF","#707AFF","#809DFF","#8FBCFF","#EEF0F5"],
  bl:.8,level:3,mono:.85,cap:"Chrome · one range",
  note:"Monochrome: violet, strong to soft, drifting to blue, then white. Screens at 80 % of the backlight, pads at level 3. To be tuned on the unit."}
};
let cur="glossy";
const svg=document.getElementById("mk");svg.setAttribute("viewBox",`0 0 ${MK3.W} ${MK3.H}`);
const NS="http://www.w3.org/2000/svg",mk=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).append(e);return e};
const [bx,by,bw,bh]=MK3.body,body=mk("rect",{x:bx,y:by,width:bw,height:bh,rx:34,stroke:"#232831"});
const screensG=mk("g",{});
const L=MK3.screens[0],Rr=MK3.screens[1];
MK3.screens.forEach(r=>mk("rect",{x:r[0],y:r[1],width:r[2],height:r[3],rx:6,fill:"#000",stroke:"#232831"},screensG));
const px=(L[2]-20)/16,py=(L[3]-20)/8,cells=[];
for(let r=0;r<8;r++)for(let c=0;c<16;c++)cells.push(mk("rect",{x:L[0]+10+c*px,y:L[1]+10+r*py,width:px-4,height:py-4,rx:2},screensG));
const wave=mk("path",{fill:"none","stroke-width":4,"stroke-linecap":"round"},screensG);
const knobs=MK3.knobs.map(([cx,cy,r])=>({g:mk("circle",{cx,cy,r,fill:"#000","stroke-width":3.5}),d:mk("circle",{cx,cy,r:3})}));
const [ex,ey,er]=MK3.encoder;mk("circle",{cx:ex,cy:ey,r:er,fill:"#000",stroke:"#7E8794","stroke-width":2});mk("circle",{cx:ex,cy:ey,r:er*.55,fill:"#232831"});
const st=MK3.strip;mk("rect",{x:st[0],y:st[1],width:st[2],height:st[3],rx:st[3]/2,fill:"#000",stroke:"#232831"});
const btn=MK3.BTN.map(b=>{const r=mk("rect",{x:b[1],y:b[2],width:b[3],height:b[4],rx:4});mk("text",{x:b[1]+b[3]/2,y:b[2]+b[4]/2+3,"text-anchor":"middle","font-size":b[0].length>7?7.5:9,fill:"#C9CED8",style:"pointer-events:none"}).textContent=b[0];return r});
const pads=MK3.pads.map(p=>mk("rect",{x:p[0],y:p[1],width:p[2],height:p[3],rx:8}));
const ACTIVE=[0,3,4,7,8,10,12,15];
function frame(ms){
  const t=ms/1000,T=TH[cur],step=Math.floor(t*6)%16,lv=[0,.38,.68,1][T.level];
  body.setAttribute("fill",T.panel);
  screensG.style.filter=`brightness(${.35+.65*T.bl})`;
  btn.forEach(r=>{r.setAttribute("fill",T.key);r.style.opacity=.55+.45*T.mono});
  cells.forEach((c,i)=>{const r=Math.floor(i/16),cc=i%16,on=((r*5+cc*3)%7<2);c.setAttribute("fill",cc===step?"#F2F4F8":on?T.brand[r]:T.off)});
  const y=x=>Rr[1]+Rr[3]*.45+Math.sin((x-Rr[0])/22+t*2.5)*Rr[3]*.3;let d="";
  for(let x=Rr[0]+10;x<=Rr[0]+Rr[2]-10;x+=4)d+=(d?"L":"M")+x+" "+y(x);
  wave.setAttribute("d",d);wave.setAttribute("stroke",T.knob[0]);
  knobs.forEach((k,i)=>{k.g.setAttribute("stroke",T.knob[i]);k.d.setAttribute("fill",T.knob[i])});
  pads.forEach((p,i)=>{const on=ACTIVE.includes(i),head=i===step;
    p.setAttribute("fill",head?"#F2F4F8":on?T.brand[(i*3)%8]:T.off);p.style.opacity=head||on?lv:1});
  requestAnimationFrame(frame)}
const tabs=document.getElementById("tabs"),cap=document.getElementById("cap");
function set(n){cur=n;[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.n===n));cap.innerHTML=`${TH[n].cap}<small>${TH[n].note}</small>`}
Object.keys(TH).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.dataset.n=n;b.onclick=()=>set(n);tabs.append(b)});
set("glossy");requestAnimationFrame(frame);
</script></body></html>
